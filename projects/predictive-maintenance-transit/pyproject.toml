[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "predictive-maintenance-transit"
version = "1.0.0"
description = "Predictive maintenance for transit systems using NASA C-MAPSS turbofan engine data"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Sierra Napier", email = "sierra.napier430@gmail.com"}
]
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.23.0",
    "scikit-learn>=1.2.0",
    "xgboost>=1.7.0",
    "lifelines>=0.27.0",
    "matplotlib>=3.6.0",
    "seaborn>=0.12.0",
    "plotly>=5.13.0",
    "streamlit>=1.22.0",
    "scipy>=1.10.0",
    "requests>=2.28.0",
    "jupyter>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.3.0",
]

[project.urls]
Homepage = "https://snapaiarchitect.github.io/ai-architect-portfolio"
Repository = "https://github.com/snapaiarchitect/ai-architect-portfolio"
Documentation = "https://snapaiarchitect.github.io/ai-architect-portfolio/projects/predictive-maintenance-transit/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.black]
line-length = 88
target-version = ['py39']

[tool.ruff]
line-length = 88
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
